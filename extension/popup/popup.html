<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Same tokens as web/src/app/globals.css; see DESIGN.md, "Applying This
       to the betterUWWorks Web App". */
    :root {
      --primary: #5645d4;
      --primary-pressed: #4534b3;
      --primary-deep: #3a2a99;
      --primary-tint: #efedfb;
      --primary-line: #d6d0f6;
      --on-primary: #ffffff;
      --canvas: #ffffff;
      --surface: #f6f5f4;
      --surface-soft: #fafaf9;
      --hairline: #e5e3df;
      --hairline-soft: #ede9e4;
      --hairline-strong: #c8c4be;
      --ink: #1a1a1a;
      --charcoal: #37352f;
      --slate: #5d5b54;
      --steel: #787671;
      --stone: #a4a097;
      --muted: #bbb8b1;
      --good: #1a8f45;
      --fair: #c26a00;
      --poor: #c92a2a;
      --error-tint: #fdf0f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 420px;
      font-family: Inter, -apple-system, system-ui, 'Segoe UI', Helvetica, sans-serif;
      background: var(--canvas);
      color: var(--charcoal);
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* Header */
    .header {
      height: 52px;
      padding: 0 16px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo {
      width: 26px; height: 26px;
      border-radius: 7px;
      background: var(--primary);
      color: var(--on-primary);
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .brand h1 { font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
    .brand p { font-size: 11.5px; color: var(--steel); margin-top: -1px; }
    .web-link {
      height: 28px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--charcoal);
      text-decoration: none;
      white-space: nowrap;
    }
    .web-link:hover { background: var(--surface); }

    .content { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

    /* Stepper */
    .steps { display: flex; align-items: center; gap: 8px; list-style: none; }
    .step { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--steel); white-space: nowrap; }
    .step-num {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 1px solid var(--hairline-strong);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--steel);
      flex-shrink: 0;
    }
    .step-line { flex: 1; height: 1px; background: var(--hairline); min-width: 12px; }
    .step.active { color: var(--ink); }
    .step.active .step-num { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    .step.done { color: var(--charcoal); }
    .step.done .step-num { background: var(--good); border-color: var(--good); color: var(--on-primary); font-size: 0; }
    .step.done .step-num::after {
      content: "";
      width: 8px; height: 4px;
      border-left: 1.6px solid currentColor;
      border-bottom: 1.6px solid currentColor;
      transform: translateY(-1px) rotate(-45deg);
    }

    /* Status */
    .status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border-radius: 10px;
      min-height: 40px;
    }
    .status.error { background: var(--error-tint); }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--stone);
      flex-shrink: 0;
      margin-top: 6px;
    }
    .status-dot.active { background: var(--primary); animation: pulse 1.5s infinite; }
    .status-dot.success { background: var(--good); }
    .status-dot.error { background: var(--poor); }
    .status-dot.paused { background: var(--fair); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { .status-dot.active { animation: none; } }
    .status-text { font-size: 13px; color: var(--charcoal); word-break: break-word; }
    .status.error .status-text { color: var(--poor); }

    /* Stats — one strip, like the web app's metric strip */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--hairline-soft);
      border-radius: 10px;
      background: var(--surface-soft);
    }
    .stat { padding: 9px 12px; min-width: 0; }
    .stat + .stat { border-left: 1px solid var(--hairline-soft); }
    .stat-label { font-size: 11.5px; color: var(--steel); }
    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat-value small { font-size: 12px; font-weight: 400; color: var(--steel); margin-left: 2px; }
    .stat-value.bad { color: var(--poor); }

    /* Progress */
    .progress { display: none; }
    .progress.visible { display: block; }
    .progress-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
    .progress-label { font-size: 12px; color: var(--slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .progress-pct { font-size: 12.5px; font-weight: 600; color: var(--primary-deep); font-variant-numeric: tabular-nums; }
    .progress-track { height: 6px; background: var(--hairline-soft); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: var(--primary); border-radius: 3px; transition: width 0.4s ease; }
    .progress-fill.paused { background: var(--fair); }
    .progress-eta { font-size: 11.5px; color: var(--steel); margin-top: 5px; text-align: right; }

    /* Buttons */
    .actions { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; }
    .btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--hairline-strong);
      background: var(--canvas);
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn:hover:not(:disabled) { background: var(--surface); }
    .btn:disabled { color: var(--muted); border-color: var(--hairline); background: var(--canvas); cursor: not-allowed; }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    .btn.primary:hover:not(:disabled) { background: var(--primary-pressed); border-color: var(--primary-pressed); }
    .btn.primary:active:not(:disabled) { background: var(--primary-deep); }
    .btn.primary:disabled { background: var(--hairline); border-color: var(--hairline); color: var(--muted); }
    .btn.danger { color: var(--poor); }
    .btn.danger:hover:not(:disabled) { background: var(--error-tint); }

    /* Footer: settings and the one destructive action */
    .footer { border-top: 1px solid var(--hairline-soft); padding: 8px 16px 12px; }
    .footer-row { display: flex; justify-content: space-between; align-items: center; }
    .link-btn {
      height: 28px;
      padding: 0 6px;
      margin: 0 -6px;
      border: none;
      background: none;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--steel);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .link-btn:hover:not(:disabled) { color: var(--ink); }
    .link-btn:disabled { color: var(--muted); cursor: not-allowed; }
    .link-btn .chev { transition: transform 0.15s; }
    .link-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
    .link-btn.reset { color: var(--poor); }
    .link-btn.reset:hover:not(:disabled) { color: var(--poor); background: var(--error-tint); }
    .link-btn.reset.confirming { background: var(--poor); color: var(--on-primary); margin: 0; padding: 0 10px; }
    .link-btn.reset:disabled { color: var(--muted); }

    .settings { margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--charcoal); }
    .field .hint { font-size: 11.5px; color: var(--steel); }
    .input {
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      font-size: 13px;
      color: var(--ink);
      background: var(--canvas);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input::placeholder { color: var(--stone); }
    .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(86, 69, 212, 0.12); }
    .settings-actions { display: flex; align-items: center; gap: 10px; }
    .settings-actions .btn { flex: 0 0 auto; height: 32px; }
    .saved-note { font-size: 12px; color: var(--good); }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="logo" aria-hidden="true">b</div>
      <div>
        <h1>betterUWWorks</h1>
        <p>Job scraper for WaterlooWorks</p>
      </div>
    </div>
    <a class="web-link hidden" id="linkWebApp" target="_blank" rel="noopener">
      Open web app
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </a>
  </header>

  <main class="content">
    <ol class="steps" aria-label="Progress">
      <li class="step" id="step1"><span class="step-num">1</span>Job list</li>
      <li class="step-line" aria-hidden="true"></li>
      <li class="step" id="step2"><span class="step-num">2</span>Details</li>
      <li class="step-line" aria-hidden="true"></li>
      <li class="step" id="step3"><span class="step-num">3</span>Sync</li>
    </ol>

    <div class="status" id="statusBox" role="status" aria-live="polite">
      <div class="status-dot" id="statusDot"></div>
      <div class="status-text" id="statusText">Open WaterlooWorks job listings to begin.</div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Jobs</div>
        <div class="stat-value" id="statJobs">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Details</div>
        <div class="stat-value" id="statDetails">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Errors</div>
        <div class="stat-value" id="statErrors">0</div>
      </div>
    </div>

    <div class="progress" id="progressSection">
      <div class="progress-head">
        <div class="progress-label" id="progressLabel"></div>
        <div class="progress-pct" id="progressPct">0%</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-eta" id="progressEta"></div>
    </div>

    <div class="actions">
      <button id="btnScrapeAll" class="btn">Scrape job list</button>
      <button id="btnScrapeDetails" class="btn" disabled>Scrape details</button>
      <div class="row hidden" id="controlRow">
        <button id="btnPause" class="btn">Pause</button>
        <button id="btnCancel" class="btn danger">Cancel</button>
      </div>
      <div class="row">
        <button id="btnSync" class="btn" disabled>Sync to web app</button>
        <button id="btnExport" class="btn" disabled style="flex: none;">Export JSON</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-row">
      <button id="btnSettings" class="link-btn" aria-expanded="false" aria-controls="settingsPanel">
        Settings
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button id="btnReset" class="link-btn reset" title="Clear the scraped jobs and details stored in the extension">Reset</button>
    </div>
    <div class="settings hidden" id="settingsPanel">
      <div class="field">
        <label for="inputWebUrl">Web app URL</label>
        <input type="url" id="inputWebUrl" class="input" placeholder="http://localhost:3000" autocomplete="off" />
      </div>
      <div class="field">
        <label for="inputApiKey">API key</label>
        <input type="password" id="inputApiKey" class="input" placeholder="Leave blank if the web app has none" autocomplete="off" />
        <span class="hint">Only needed if API_KEY is set on the web app.</span>
      </div>
      <div class="settings-actions">
        <button id="btnSaveSettings" class="btn">Save</button>
        <span class="saved-note hidden" id="savedNote">Saved</span>
      </div>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
