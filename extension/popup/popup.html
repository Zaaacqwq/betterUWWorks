<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* === DESIGN.md Tokens === */
    :root {
      --primary: #5645d4;
      --primary-pressed: #4534b3;
      --primary-deep: #3a2a99;
      --on-primary: #ffffff;
      --brand-navy: #0a1530;
      --link-blue: #0075de;
      --brand-green: #1aae39;
      --brand-orange: #dd5b00;
      --brand-orange-deep: #793400;
      --brand-yellow: #f5d75e;
      --card-tint-peach: #ffe8d4;
      --card-tint-mint: #d9f3e1;
      --card-tint-lavender: #e6e0f5;
      --card-tint-yellow-bold: #f9e79f;
      --canvas: #ffffff;
      --surface: #f6f5f4;
      --surface-soft: #fafaf9;
      --hairline: #e5e3df;
      --hairline-soft: #ede9e4;
      --hairline-strong: #c8c4be;
      --ink-deep: #000000;
      --ink: #1a1a1a;
      --charcoal: #37352f;
      --slate: #5d5b54;
      --steel: #787671;
      --stone: #a4a097;
      --muted: #bbb8b1;
      --success: #1aae39;
      --warning: #dd5b00;
      --error: #e03131;
      --rounded-sm: 6px;
      --rounded-md: 8px;
      --rounded-lg: 12px;
      --rounded-full: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 420px;
      font-family: Inter, -apple-system, system-ui, 'Segoe UI', Helvetica, sans-serif;
      background: var(--canvas);
      color: var(--charcoal);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Header — brand-navy hero band */
    .header {
      padding: 20px 24px;
      background: var(--brand-navy);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon {
      width: 36px; height: 36px;
      background: var(--primary);
      border-radius: var(--rounded-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--on-primary);
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--on-primary);
      letter-spacing: -0.3px;
    }
    .header p {
      font-size: 12px;
      color: var(--stone);
      margin-top: 1px;
      font-weight: 400;
    }

    /* Content */
    .content {
      padding: 20px 24px;
    }

    /* Steps — pill tabs */
    .steps {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: var(--rounded-full);
      border: 1px solid var(--hairline);
      background: transparent;
      transition: all 0.15s;
    }
    .step-num {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--surface);
      color: var(--steel);
      font-size: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--steel);
    }
    .step.active {
      background: var(--ink-deep);
      border-color: var(--ink-deep);
    }
    .step.active .step-num {
      background: var(--primary);
      color: var(--on-primary);
    }
    .step.active .step-text { color: var(--on-primary); }
    .step.done {
      background: var(--card-tint-mint);
      border-color: var(--card-tint-mint);
    }
    .step.done .step-num {
      background: var(--brand-green);
      color: var(--on-primary);
    }
    .step.done .step-text { color: var(--charcoal); }
    .step-arrow {
      color: var(--muted);
      font-size: 12px;
      flex-shrink: 0;
    }

    /* Status card */
    .status-card {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--rounded-lg);
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-height: 48px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--stone);
      flex-shrink: 0;
      margin-top: 5px;
    }
    .status-dot.active { background: var(--primary); animation: pulse 1.5s infinite; }
    .status-dot.success { background: var(--success); }
    .status-dot.error { background: var(--error); }
    .status-dot.paused { background: var(--warning); }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .status-text {
      font-size: 13px;
      color: var(--slate);
      line-height: 1.4;
      word-break: break-word;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat {
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: var(--rounded-lg);
      padding: 12px 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1;
    }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--stone);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .stat-label.purple { color: var(--primary); }
    .stat-label.green { color: var(--brand-green); }
    .stat-label.orange { color: var(--brand-orange); }

    /* Progress */
    .progress-section {
      margin-bottom: 16px;
      display: none;
    }
    .progress-section.visible { display: block; }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .progress-label {
      font-size: 12px;
      color: var(--slate);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
      font-weight: 500;
    }
    .progress-pct {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
    }
    .progress-track {
      height: 6px;
      background: var(--hairline);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 3px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .progress-fill.paused { background: var(--warning); }
    .progress-eta {
      font-size: 11px;
      color: var(--stone);
      margin-top: 6px;
      text-align: right;
      font-weight: 500;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 10px 18px;
      border: none;
      border-radius: var(--rounded-md);
      font-family: Inter, -apple-system, system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.3;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:disabled {
      background: var(--hairline) !important;
      color: var(--muted) !important;
      border-color: var(--hairline) !important;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) { filter: brightness(0.95); }
    button:active:not(:disabled) { filter: brightness(0.9); }

    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-pressed); filter: none; }
    .btn-primary:active:not(:disabled) { background: var(--primary-deep); filter: none; }

    .btn-dark {
      background: var(--ink-deep);
      color: var(--on-primary);
    }
    .btn-warning {
      background: var(--card-tint-peach);
      color: var(--brand-orange-deep);
      border: 1px solid var(--card-tint-peach);
    }
    .btn-danger {
      background: var(--canvas);
      color: var(--error);
      border: 1px solid var(--hairline-strong);
    }
    .btn-secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--hairline-strong);
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--surface);
      filter: none;
    }
    .btn-success {
      background: var(--card-tint-mint);
      color: var(--charcoal);
      border: 1px solid var(--card-tint-mint);
    }

    /* Settings */
    .settings-section {
      margin-top: 16px;
      border-top: 1px solid var(--hairline);
      padding-top: 12px;
    }
    .settings-toggle {
      background: none;
      border: none;
      color: var(--steel);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 0;
      flex: unset;
    }
    .settings-toggle:hover { color: var(--ink); }
    .settings-panel {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .settings-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--stone);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .settings-input {
      padding: 8px 12px;
      border: 1px solid var(--hairline);
      border-radius: var(--rounded-md);
      font-family: Inter, sans-serif;
      font-size: 13px;
      color: var(--ink);
      background: var(--canvas);
      outline: none;
      transition: border-color 0.15s;
    }
    .settings-input:focus {
      border-color: var(--primary);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">B</div>
    <div>
      <h1>betterUWWorks</h1>
      <p>WaterlooWorks Job Scraper</p>
    </div>
  </div>

  <div class="content">
    <!-- Steps (pill-tab style) -->
    <div class="steps">
      <div class="step" id="step1">
        <div class="step-num">1</div>
        <div class="step-text">Scrape</div>
      </div>
      <div class="step-arrow">&rsaquo;</div>
      <div class="step" id="step2">
        <div class="step-num">2</div>
        <div class="step-text">Details</div>
      </div>
      <div class="step-arrow">&rsaquo;</div>
      <div class="step" id="step3">
        <div class="step-num">3</div>
        <div class="step-text">Export</div>
      </div>
    </div>

    <!-- Status -->
    <div class="status-card">
      <div class="status-dot" id="statusDot"></div>
      <div class="status-text" id="statusText">Navigate to WaterlooWorks job listings to begin.</div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="statJobs">0</div>
        <div class="stat-label purple">Jobs</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statDetails">0</div>
        <div class="stat-label green">Details</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statErrors">0</div>
        <div class="stat-label orange">Errors</div>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-section" id="progressSection">
      <div class="progress-header">
        <div class="progress-label" id="progressLabel"></div>
        <div class="progress-pct" id="progressPct">0%</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-eta" id="progressEta"></div>
    </div>

    <!-- Buttons -->
    <div class="btn-group">
      <button id="btnScrapeAll" class="btn-primary">Scrape All Jobs</button>
      <button id="btnScrapeDetails" class="btn-dark" disabled>Scrape Details</button>
      <div class="btn-row hidden" id="controlRow">
        <button id="btnPause" class="btn-warning">Pause</button>
        <button id="btnCancel" class="btn-danger">Cancel</button>
      </div>
      <button id="btnSync" class="btn-dark" disabled>Sync to Web</button>
      <div class="btn-row">
        <button id="btnExport" class="btn-secondary" disabled>Export JSON</button>
        <button id="btnReset" class="btn-secondary">Reset</button>
      </div>
    </div>
  </div>

    <!-- Settings -->
    <div class="settings-section">
      <button id="btnSettings" class="settings-toggle">Settings</button>
      <div class="settings-panel hidden" id="settingsPanel">
        <label class="settings-label">Web App URL</label>
        <input type="text" id="inputWebUrl" class="settings-input" placeholder="http://localhost:3000" />
        <label class="settings-label">API Key (optional)</label>
        <input type="text" id="inputApiKey" class="settings-input" placeholder="Leave blank if not set" />
        <button id="btnSaveSettings" class="btn-primary" style="margin-top:8px;">Save</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
