services:
  postgres:
    image: postgres:16-alpine
    container_name: buw-postgres
    environment:
      POSTGRES_USER: buw
      POSTGRES_PASSWORD: buw_dev_password
      POSTGRES_DB: betteruwworks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
